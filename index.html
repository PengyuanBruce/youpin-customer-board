<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户优爆品数据看板</title>
<style>
:root{
  --bg:#050a12;
  --panel:rgba(14,24,38,.82);
  --panel-2:rgba(10,19,31,.72);
  --line:rgba(120,190,255,.14);
  --line-2:rgba(120,190,255,.28);
  --txt:#e9f2fc;
  --dim:#93a9c1;
  --muted:#63798f;
  --cyan:#3fd0ff;
  --gold:#ffc857;
  --green:#3ddc97;
  --red:#ff6f7d;
  --font:"HarmonyOS Sans SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100dvh;
  background:
    radial-gradient(1100px 520px at 12% -12%, rgba(63,208,255,.16), transparent 62%),
    radial-gradient(900px 480px at 92% 0%, rgba(255,200,87,.09), transparent 60%),
    radial-gradient(800px 600px at 60% 110%, rgba(63,208,255,.07), transparent 65%),
    var(--bg);
  color:var(--txt);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  padding-bottom:36px;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(120,190,255,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120,190,255,.045) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 20%, #000 0%, transparent 78%);
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

/* ---------- 顶栏 ---------- */
.top{
  position:sticky;top:0;z-index:20;
  display:flex;flex-wrap:wrap;gap:14px 22px;align-items:center;
  padding:14px clamp(14px,2.4vw,34px);
  background:linear-gradient(180deg, rgba(6,12,20,.96), rgba(6,12,20,.82));
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{
  width:38px;height:38px;flex:none;border-radius:11px;
  display:grid;place-items:center;font-weight:700;font-size:17px;color:#04121a;
  background:linear-gradient(145deg,#7ee3ff,#25b3e6 60%,#1f7fb0);
  box-shadow:0 0 22px rgba(63,208,255,.45), inset 0 1px 0 rgba(255,255,255,.5);
}
.brand h1{font-size:16.5px;margin:0;letter-spacing:.5px;font-weight:650;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--muted);letter-spacing:.3px;margin-top:2px;white-space:nowrap}
@media (max-width:640px){.brand{min-width:0}.brand .sub{white-space:normal;line-height:1.35}}
.brand .sub b{color:var(--cyan);font-weight:600}

.tabs{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:1 1 420px;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{
  position:relative;flex:none;display:flex;align-items:baseline;gap:6px;
  padding:8px 13px;border-radius:9px;border:1px solid transparent;
  color:var(--dim);font-size:13px;text-decoration:none;cursor:pointer;
  transition:.18s;white-space:nowrap;background:transparent;
}
.tab:hover{color:var(--txt);background:rgba(63,208,255,.07);border-color:var(--line)}
.tab.on{
  color:#eaf9ff;border-color:rgba(63,208,255,.5);
  background:linear-gradient(180deg,rgba(63,208,255,.22),rgba(63,208,255,.08));
  box-shadow:0 0 0 1px rgba(63,208,255,.1), 0 6px 18px -8px rgba(63,208,255,.7);
}
.tab .tv{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.on .tv{color:rgba(234,249,255,.72)}
.tab.home{font-weight:600}

main{position:relative;z-index:1;padding:clamp(14px,2vw,26px) clamp(14px,2.4vw,34px) 0;max-width:1680px;margin:0 auto}
section[hidden]{display:none !important}

/* ---------- 通用块 ---------- */
.block{
  background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:clamp(14px,1.6vw,20px);margin-bottom:16px;
  box-shadow:0 18px 44px -30px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.03);
}
.block-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:14px}
.block-h h2{margin:0;font-size:14.5px;letter-spacing:.6px;font-weight:650;display:flex;align-items:center;gap:9px}
.block-h h2::before{content:"";width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,var(--cyan),transparent)}
.block-h .meta{font-size:11.5px;color:var(--muted);letter-spacing:.3px}
.block-h .meta b{color:var(--dim);font-weight:600}

/* ---------- 首页 KPI ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));gap:12px}
.kpi{
  position:relative;border:1px solid var(--line);border-radius:13px;padding:14px 15px 13px;
  background:linear-gradient(160deg,rgba(63,208,255,.075),rgba(255,255,255,.012) 55%);
  overflow:hidden;min-width:0;
}
.kpi::after{content:"";position:absolute;inset:auto -30% -60% auto;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(63,208,255,.18),transparent 70%);pointer-events:none}
.kpi .k{font-size:11.5px;color:var(--dim);letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:clamp(22px,2.5vw,29px);font-weight:680;letter-spacing:-.5px;margin-top:7px;line-height:1.1}
.kpi .v small{font-size:12px;font-weight:500;color:var(--dim);margin-left:3px;letter-spacing:0}
.kpi .f{font-size:11.5px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi .f b{color:var(--dim);font-weight:600}
.kpi.gold{background:linear-gradient(160deg,rgba(255,200,87,.1),rgba(255,255,255,.012) 55%);border-color:rgba(255,200,87,.22)}
.kpi.gold .v{color:var(--gold)}
.kpi.gold::after{background:radial-gradient(circle,rgba(255,200,87,.2),transparent 70%)}

.bar{display:block;height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:9px}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#25b3e6,#7ee3ff)}
.bar.gold > i{background:linear-gradient(90deg,#d99b1f,#ffc857)}
.bar.sm{margin-top:6px;height:4px}

/* ---------- 挑战赛 ---------- */
.ch-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.ch-panel{border:1px solid var(--line);border-radius:13px;background:var(--panel-2);overflow:hidden;min-width:0}
.ch-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line);
  background:linear-gradient(90deg,rgba(255,200,87,.1),transparent 70%);
}
.ch-head .t{font-size:13px;font-weight:640;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.ch-head .t em{font-style:normal;font-size:10.5px;color:var(--gold);border:1px solid rgba(255,200,87,.35);
  border-radius:99px;padding:1px 7px;letter-spacing:.4px}
.ch-head .s{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-cols,.ch-row{display:grid;grid-template-columns:24px minmax(58px,1fr) 74px 70px 74px 96px;gap:6px;align-items:center}
.ch-cols{padding:7px 12px;font-size:10.5px;color:var(--muted);letter-spacing:.4px;border-bottom:1px solid rgba(120,190,255,.08)}
.ch-body{overflow:visible}
.ch-row{padding:7px 12px;font-size:12.5px;border-bottom:1px solid rgba(120,190,255,.05)}
.ch-row:hover{background:rgba(63,208,255,.055)}
.ch-row .rk{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ch-row .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#dcebf9}
.ch-row .rv{text-align:right;font-variant-numeric:tabular-nums;color:#cfe2f4}
.ch-row .rv.add{color:var(--green)}
.ch-row .rv.add.neg{color:var(--red)}
.ch-row .rv.na{color:var(--muted)}
.ch-row .pv{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim)}
.ch-row .pv .bar{margin-top:4px}
.ch-row.top1 .rk{color:var(--gold)}
.ch-row.top1 .who{color:#fff}
.ch-body.kf2{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.ch-body.kf2 > div{min-width:0}
.ch-panel.kf .ch-cols,.ch-panel.kf .ch-row{grid-template-columns:22px minmax(52px,1fr) 66px 64px 78px 62px}

/* ---------- 人物页 ---------- */
.p-head{
  display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;
  margin-bottom:14px;
}
.p-title{display:flex;align-items:center;gap:12px;min-width:0}
.p-avatar{
  width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;
  font-size:18px;font-weight:650;color:#04121a;
  background:linear-gradient(145deg,#ffe0a3,#ffc857 65%,#c98f1a);
  box-shadow:0 0 20px rgba(255,200,87,.3), inset 0 1px 0 rgba(255,255,255,.55);
}
.p-title h2{margin:0;font-size:20px;letter-spacing:.6px;font-weight:650}
.p-title .ps{font-size:11.5px;color:var(--muted);margin-top:4px;letter-spacing:.3px}
.p-title .ps b{color:var(--dim);font-weight:600}

.p-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pk{
  border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--panel-2);min-width:0;
}
.pk .k{font-size:11px;color:var(--dim);letter-spacing:.4px}
.pk .v{font-size:clamp(18px,2vw,23px);font-weight:670;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.pk.hl .v{color:var(--cyan)}
.pk.gold .v{color:var(--gold)}

.note{
  display:flex;gap:9px;align-items:flex-start;
  border:1px dashed rgba(255,200,87,.34);background:rgba(255,200,87,.055);
  color:#e8d5a9;border-radius:11px;padding:10px 13px;font-size:12px;line-height:1.6;margin-bottom:14px;
}
.note i{font-style:normal;color:var(--gold);font-weight:700}
.note.mini{border-style:solid;border-color:var(--line);background:transparent;color:var(--muted);padding:7px 13px;margin-bottom:12px}
.note.mini b{color:var(--gold)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;letter-spacing:.2px;
  color:#8fd8ff;background:rgba(63,208,255,.10);border:1px solid rgba(63,208,255,.26);white-space:nowrap}
.tag-empty{color:var(--muted);background:transparent;border-color:var(--line)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.search{position:relative;flex:0 1 260px;min-width:160px}
.search input{
  width:100%;padding:8px 12px 8px 30px;border-radius:9px;font-size:12.5px;font-family:inherit;
  border:1px solid var(--line);background:rgba(6,12,20,.7);color:var(--txt);outline:none;
}
.search input:focus{border-color:rgba(63,208,255,.5);box-shadow:0 0 0 3px rgba(63,208,255,.1)}
.search::before{content:"⌕";position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px}
.hint{font-size:11.5px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:rgba(6,12,20,.42)}
table{width:100%;border-collapse:collapse;min-width:620px}
thead th{
  position:sticky;top:0;z-index:2;text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.4px;
  color:var(--dim);padding:10px 13px;background:#0a1421;border-bottom:1px solid var(--line-2);
  white-space:nowrap;cursor:pointer;user-select:none;
}
thead th.r{text-align:right}
thead th .ar{font-size:9px;color:var(--cyan);margin-left:4px;opacity:.9}
thead th .th-sub{display:block;font-size:10px;font-weight:400;color:var(--muted);letter-spacing:0;margin-top:2px}
thead th:hover{color:var(--txt)}
tbody td{padding:10px 13px;font-size:13px;border-bottom:1px solid rgba(120,190,255,.06);font-variant-numeric:tabular-nums}
tbody tr:hover{background:rgba(63,208,255,.055)}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
td.cust{font-variant-numeric:normal;max-width:420px}
td.cust .cn{color:#e4f0fb;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.cust .cs{font-size:10.5px;color:var(--muted);margin-top:2px}
td .rk2{font-size:11px;color:var(--muted)}
.v-you{color:#eaf9ff;font-weight:600;font-size:13.5px}
.v-trade{color:#c9dcee}
.dl{display:inline-flex;align-items:center;gap:2px;padding:1px 7px;border-radius:99px;font-size:12px;font-weight:600}
.dl.up{color:var(--green);background:rgba(61,220,151,.12)}
.dl.dn{color:var(--red);background:rgba(255,111,125,.12)}
.dl.z{color:var(--dim);background:rgba(120,190,255,.09)}
.dl.na{color:var(--muted);background:transparent;font-weight:500}
.empty{padding:26px 14px;text-align:center;color:var(--muted);font-size:12.5px}

footer{
  position:relative;z-index:1;max-width:1680px;margin:0 auto;padding:16px clamp(14px,2.4vw,34px) 0;
  font-size:11.5px;color:var(--muted);line-height:1.75;
}
footer b{color:var(--dim);font-weight:600}
footer .sep{color:rgba(120,190,255,.3);margin:0 7px}

@media (max-width:880px){
  .top{gap:10px}
  .brand h1{font-size:15px}
  .tabs{flex-basis:100%;order:3}
  .ch-cols,.ch-row{grid-template-columns:20px minmax(46px,1fr) 62px 58px 62px 78px;gap:4px}
  .p-title h2{font-size:18px}
}
@media (max-width:560px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .p-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ch-body.kf2{grid-template-columns:1fr;gap:0}
  .ch-cols,.ch-row{font-size:11.5px;grid-template-columns:18px minmax(40px,1fr) 52px 54px 64px;gap:4px}
  .ch-panel:not(.kf) .ch-cols span:nth-child(5),.ch-panel:not(.kf) .ch-row > *:nth-child(5){display:none}
  .ch-panel.kf .ch-cols,.ch-panel.kf .ch-row{grid-template-columns:16px minmax(30px,1fr) 44px 48px 44px;gap:3px;padding-left:8px;padding-right:8px}
  .ch-panel.kf .ch-cols span:nth-child(4),.ch-panel.kf .ch-row > *:nth-child(4){display:none}
}
</style>
</head>

const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (n) => (n === null || n === undefined || Number.isNaN(n)) ? "--" : Math.round(n).toLocaleString("en-US");
const pct = (n) => (n === null || n === undefined || Number.isNaN(n)) ? "--" : (Math.round(n * 10) / 10).toFixed(1) + "%";
const clamp = (n) => Math.max(0, Math.min(100, Number(n) || 0));

function delta(n, unit = "") {
  if (n === null || n === undefined || Number.isNaN(n)) return '<span class="dl na" title="需相邻数据日快照">--</span>';
  const v = Math.round(n);
  if (v > 0) return `<span class="dl up">+${v.toLocaleString("en-US")}${unit}</span>`;
  if (v < 0) return `<span class="dl dn">${v.toLocaleString("en-US")}${unit}</span>`;
  return `<span class="dl z">0${unit}</span>`;
}

/* ---------------- 首页 ---------------- */
function challengeDays(ch) {
  if (!ch.end || !BOARD.meta.data_ds) return null;
  const end = new Date(ch.end + "T00:00:00");
  const cur = new Date(BOARD.meta.data_ds + "T00:00:00");
  return Math.round((end - cur) / 86400000) + 1;
}

function chRow(i, name, value, add, target, rate, isTop) {
  const addHtml = add === null || add === undefined
    ? '<span class="rv na">--</span>'
    : `<span class="rv add ${add < 0 ? "neg" : ""}">${add > 0 ? "+" : ""}${fmt(add)}</span>`;
  return `<div class="ch-row${isTop ? " top1" : ""}">
    <span class="rk">${i}</span>
    <span class="who" title="${esc(name)}">${esc(name)}</span>
    <span class="rv">${fmt(value)}</span>
    ${addHtml}
    <span class="rv">${target === null || target === undefined ? "--" : fmt(target)}</span>
    <span class="pv">${pct(rate)}<span class="bar sm${isTop ? " gold" : ""}"><i style="width:${clamp(rate)}%"></i></span></span>
  </div>`;
}

function personRows(p) {
  const q = state.q.trim();
  let rows = p.customers.filter((c) => !q || c.name.includes(q) || (c.kefu || "").includes(q));
  const k = state.sortKey, d = state.sortDir;
  rows.sort((a, b) => {
    const va = a[k], vb = b[k];
    if (va === null || va === undefined) return 1;
    if (vb === null || vb === undefined) return -1;
    if (typeof va === "string") return va.localeCompare(vb, "zh") * d;
    return (va - vb) * d;
  });
  return rows;
}

  </div>

  <div class="p-kpi">
    <div class="pk"><div class="k">客户数</div><div class="v num">${p.count}</div></div>
    <div class="pk hl"><div class="k">当前优爆品数</div><div class="v num">${fmt(p.you)}</div></div>
    <div class="pk"><div class="k">总交易品数</div><div class="v num">${fmt(p.trade)}</div></div>
    <div class="pk gold" ${p.month_add_partial ? `title="本页 ${p.month_add_excluded} 家未计入（多账号客户或平台无商品数据）"` : ""}><div class="k">本月新增</div><div class="v num">${p.month_add === null ? "--" : (p.month_add > 0 ? "+" : "") + fmt(p.month_add) + (p.month_add_partial ? " *" : "")}</div></div>
    <div class="pk gold" ${p.day_add_partial ? `title="本页 ${p.day_add_excluded} 家未计入（多账号客户或平台无商品数据）"` : ""}><div class="k">今日新增</div><div class="v num">${p.day_add === null ? "--" : (p.day_add > 0 ? "+" : "") + fmt(p.day_add) + (p.day_add_partial ? " *" : "")}</div></div>
  </div>`;

  const meta = BOARD.meta;
  const gapWarn = meta.day_gap && meta.day_gap > 1
    ? `「今日新增」对比的是上一可用数据日 <b>${esc(meta.prev_ds)}</b>（间隔 ${meta.day_gap} 天，平台未提供中间日期的盘点分区），因此这一列是<b>该区间累计</b>，不是严格的一日环比。`
    : "";
  const miss = missing
    ? `缺基准的格子一律显示 <b>--</b>，不拿 0 或上月值顶替（快照 ${meta.snapshot_dates.length} 份${meta.prev_ds ? "，上一数据日 " + esc(meta.prev_ds) : "，暂无上一数据日"}）。`
    : "";
  const exDay = p.day_add_excluded || 0;
  const exMon = p.month_add_excluded || 0;
  const ambiguous = exDay > 0 && p.ambig_rows >= exDay;
  const legend = (p.day_add_partial || p.month_add_partial)
    ? (ambiguous
      ? `<b>*</b> 本页 ${exDay} 家客户在同一销售名下对应多个国际站账号（同公司多账号），账号级对应关系自 ${esc(meta.data_ds)} 起才固定，本期新增未计入；下一数据日恢复正常。`
      : `<b>*</b> 本页 ${exDay || exMon} 家客户平台未下发商品数据，未计入新增。`)
    : "";
  if (missing || gapWarn) {
    html += `<div class="note"><i>!</i><div>${gapWarn}${miss}${legend}</div></div>`;
  } else if (legend) {
    html += `<div class="note mini"><div>${legend}</div></div>`;
  }

  html += `<div class="block">
    <div class="tools">
      <div class="search"><input id="q" placeholder="搜客户名 / 客服" value="${esc(state.q)}"></div>
      <div class="hint">共 ${rows.length} 家 · 合计 优爆品 ${fmt(rows.reduce((a, c) => a + (c.you || 0), 0))} · 交易品 ${fmt(rows.reduce((a, c) => a + (c.trade || 0), 0))}</div>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th style="width:52px">#</th>
          <th style="width:30%">客户名称</th>
          <th style="width:12%">客户类型</th>
          <th class="r" data-k="you" style="width:13%">当前优爆品数${arrow("you")}</th>
          <th class="r" data-k="trade" style="width:13%">总交易品数${arrow("trade")}</th>
          <th class="r" data-k="month_add" style="width:13%">本月新增${arrow("month_add")}${BOARD.meta.month_base_ds ? `<span class="th-sub">较 ${esc(BOARD.meta.month_base_ds.slice(5))}</span>` : ""}</th>
          <th class="r" data-k="day_add" style="width:13%">今日新增${arrow("day_add")}${BOARD.meta.prev_ds ? `<span class="th-sub">较 ${esc(BOARD.meta.prev_ds.slice(5))}</span>` : ""}</th>
        </tr></thead>
        <tbody>`;

  if (!rows.length) {
    html += `<tr><td colspan="7"><div class="empty">没有匹配的客户</div></td></tr>`;
  } else {
    rows.forEach((c, i) => {
      html += `<tr>
        <td><span class="rk2 num">${i + 1}</span></td>
        <td class="cust"><span class="cn" title="${esc(c.name)}">${esc(c.name)}</span>${c.kefu ? `<span class="cs">客服 ${esc(c.kefu)}</span>` : ""}</td>
        <td>${c.ctype ? `<span class="tag">${esc(c.ctype)}</span>` : '<span class="tag tag-empty">—</span>'}</td>
        <td class="r"><span class="v-you">${fmt(c.you)}</span></td>
        <td class="r"><span class="v-trade">${fmt(c.trade)}</span></td>
        <td class="r">${delta(c.month_add)}</td>
        <td class="r">${delta(c.day_add)}</td>
      </tr>`;
    });
  }
  html += `</tbody></table></div></div>`;

  $("#view-person").innerHTML = html;
  const q = $("#q");
  if (q) {
    q.addEventListener("input", (e) => { state.q = e.target.value; renderPerson(); const el = $("#q"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); });
  }
  document.querySelectorAll("#view-person th[data-k]").forEach((th) => {
    th.addEventListener("click", () => {
      const k = th.dataset.k;
      if (state.sortKey === k) state.sortDir *= -1; else { state.sortKey = k; state.sortDir = -1; }
      renderPerson();
    });
  });
}

/* ---------------- 页脚 ---------------- */
function renderFoot() {
  const m = BOARD.meta;
  $("#foot").innerHTML = `
    <div><b>口径：</b>「当前优爆品数」= 平台字段 youbaopin_prd_cnt（含其中爆品）；「总交易品数」= jiaoyi_prd_cnt；只看 CGS 客户（is_cgs_service = Y），客户清单取自工作区各销售 xlsx（清单数据日 ${esc(m.member_ds)}）${m.inventory && m.inventory.used ? `，指标刷新自平台「全量客户盘点」stat_date <b>${esc(m.inventory.ds)}</b>（匹配 ${m.inventory.matched}/${m.inventory.total} 家）` : ""}。抓取 ${esc(m.captured_at)}。</div>
    <div><b>新增：</b>今日新增 = 当前数据日 − 上一可用数据日快照${m.prev_ds ? `（${esc(m.prev_ds)}，间隔 ${m.day_gap} 天）` : ""}；本月新增 = 当前数据日 − 本月首个数据日快照。快照存于 <b>snapshots/</b>，缺基准显示 --。
    <span class="sep">|</span>快照 ${m.snapshot_dates.length} 份：${m.snapshot_dates.map(esc).join("、") || "无"}</div>
    <div><b>首页：</b>公司大屏同源 data_cur.json（更新 ${esc(m.home_update || "--")}），平台口径，与子页的 CGS 口径不同，不要跨页相加。</div>`;
}

/* ---------------- 路由 ---------------- */
function route() {
  const h = decodeURIComponent(location.hash || "#/home");
  const m = h.match(/^#\/p\/(.+)$/);
  if (m) {
    const idx = BOARD.persons.findIndex((p) => p.name === m[1]);
    state.view = "person";
    state.person = idx >= 0 ? idx : 0;
    state.q = "";
    $("#view-home").hidden = true;
    $("#view-person").hidden = false;
    renderPerson();
  } else {
    state.view = "home";
    $("#view-home").hidden = false;
    $("#view-person").hidden = true;
    renderHome();
  }
  markNav();
  window.scrollTo({ top: 0, behavior: "auto" });
}

if (BOARD) {
  renderNav();
  renderFoot();
  window.addEventListener("hashchange", route);
  route();
}
</script>
</body>
</html>
